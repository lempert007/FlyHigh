[project]
name = "flyhigh-backend"
version = "0.1.0"
description = "FlyHigh — Drone Mission Planner Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "rasterio>=1.3.10,<1.4",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "utm>=0.7.0",
    "plotly>=5.22.0",
    "folium>=0.16.0",
    "fpdf2>=2.7.0",
    "matplotlib>=3.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
no-build-package = ["rasterio"]  # rasterio 1.3.x binary wheels bundle their own GDAL — no system GDAL needed
dev-dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]
