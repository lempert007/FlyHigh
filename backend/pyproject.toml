[project]
name = "flyhigh-backend"
version = "0.1.0"
description = "FlyHigh — Drone Mission Planner Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "rasterio>=1.3.10,<1.4",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "utm>=0.7.0",
    "plotly>=5.22.0",
    "folium>=0.16.0",
    "fpdf2>=2.7.0",
    "matplotlib>=3.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
no-build-package = ["rasterio"]  # rasterio 1.3.x binary wheels bundle their own GDAL — no system GDAL needed
dev-dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long — handled by formatter
    "E402",   # module-level import not at top — some modules import at bottom intentionally
    "B008",   # function call in default arg — FastAPI Depends() pattern
    "B904",   # raise-without-from inside except — pre-existing pattern, fix incrementally
    "B905",   # zip() without strict= — pre-existing pattern
    "SIM105", # use contextlib.suppress — opinionated
    "SIM108", # ternary over if-else — opinionated
    "UP042",  # replace StrEnum — requires refactoring
]

[tool.ruff.lint.isort]
known-first-party = ["core", "api", "export"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
